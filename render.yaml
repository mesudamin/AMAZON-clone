services:
  - type: web
    name: amazon-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: STRIPE_KEY
        sync: false

  - type: web
    name: amazon-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://amazon-clone-e0n7.onrender.com
